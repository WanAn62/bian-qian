name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish portable (framework-dependent)
        run: dotnet publish src/Notelet/Notelet.csproj -c Release -r win-x64 --self-contained false -o out/portable

      - name: Publish single-file exe (self-contained, directly runnable)
        run: >
          dotnet publish src/Notelet/Notelet.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/exe

      - name: Package
        shell: pwsh
        run: |
          @'
          简签 Notelet — 使用说明
          ========================

          1. 解压后双击 Notelet.exe 即可使用（便携版需要已安装 .NET 9 Desktop Runtime）。
          2. 数据保存在 %APPDATA%\Notelet，纯本地存储，不上传任何内容。
          3. 把 .txt / .md 文件拖进窗口即可导入；把卡片拖到桌面即可导出为 .txt。
          4. 点右上角调色板按钮可更换主题与配色；回收站里的便签可随时恢复。

          项目主页与源码：https://github.com/WanAn62/bian-qian
          '@ | Out-File -FilePath out/portable/说明.txt -Encoding utf8

          Copy-Item out/exe/Notelet.exe "Notelet-$env:GITHUB_REF_NAME-win-x64.exe"
          Compress-Archive -Path out/portable/* -DestinationPath "Notelet-$env:GITHUB_REF_NAME-portable.zip"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem *.zip, *.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } |
            Out-File -FilePath checksums.txt -Encoding ascii
          Get-Content checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Notelet-win-x64
          path: |
            Notelet-*.exe
            Notelet-*.zip
            checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          简签 Notelet v${GITHUB_REF_NAME#v} 🎉

          小而美的 Windows 桌面便签：拖进拖出、随心美化、轻量省内存。

          ## 📦 下载哪个？

          | 文件 | 说明 |
          | --- | --- |
          | \`Notelet-${GITHUB_REF_NAME}-win-x64.exe\` | ✅ 推荐：完全自包含单文件，**下载后直接双击运行**，无需安装任何运行时 |
          | \`Notelet-${GITHUB_REF_NAME}-portable.zip\` | 轻量版（约 1 MB），需已安装 [.NET 9 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0) |

          SHA256 校验值见 \`checksums.txt\`。

          ## ✨ 功能亮点

          - 卡片便签墙 + 侧边栏工作台：视图导航、按颜色过滤、双击新建/编辑
          - Markdown：分屏实时渲染、预览模式，任务清单可直接点击勾选
          - 待办便签：回车自动续写任务，卡片显示完成进度条
          - 便签提醒：到点托盘弹窗通知，卡片显示 ⏰
          - Ctrl+滚轮缩放字号（编辑 / 预览 / 磁贴）；删除后 6 秒内可撤销
          - 图片便签：拖入图片或粘贴截图，卡片缩略图 + 预览/磁贴内嵌显示
          - 快速便签：Ctrl+Alt+Q 随手唤出小窗，可多开
          - 磁贴模式：便签贴在桌面，速览 / 复制 / 直接编辑
          - 拖进来：.txt / .md / 图片拖进窗口即成便签；拖出去：卡片即导出为文件
          - 美化：6 套预设主题 + 自定义配色、圆角、字号、字体，Windows 11 原生云母 / 亚克力
          - 设置中心：开机自启、关闭到托盘、跟随系统深浅色、备份管理
          - 右键卡片：导出为 PNG 图片（2 倍清晰度）/ 导出文件 / 置顶 / 磁贴
          - 回收站、实时搜索、自动保存 + 启动备份、纯本地存储

          ## 🖥 系统要求

          Windows 10 1809+ / Windows 11；云母与亚克力背景效果需要 Windows 11 22H2+。

          ---
          English: A small & beautiful sticky-notes app for Windows. Markdown live-split rendering, image notes, editable desktop tiles, quick notes, global hotkeys, fully customizable themes with native Mica/Acrylic backdrop.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "简签 Notelet $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            Notelet-*.exe Notelet-*.zip checksums.txt
