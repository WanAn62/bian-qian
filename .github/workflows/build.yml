name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish portable (framework-dependent)
        run: dotnet publish src/Notelet/Notelet.csproj -c Release -r win-x64 --self-contained false -o out/portable

      - name: Publish single-file (self-contained)
        run: >
          dotnet publish src/Notelet/Notelet.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/singlefile

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Notelet-win-x64
          path: out/
